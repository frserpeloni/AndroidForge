name: SERMAX Windows CI

on:
  push:
    branches:
      - main
      - sermax-windows-community
      - sermax-windows-integration-20261029
    paths:
      - "SERMAX-Windows/**"
      - ".github/workflows/sermax-windows-ci.yml"
  pull_request:
    paths:
      - "SERMAX-Windows/**"
      - ".github/workflows/sermax-windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SERMAX-Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install --upgrade pip pyinstaller
      - name: Verify required SERMAX sources
        shell: pwsh
        run: |
          $required = @(
            "sermax_core.py",
            "sermax_launcher.py",
            "SERMAX.spec",
            "SERMAX_terminal/sermax_terminal.py",
            "SERMAX_terminal/sermax_voz.py",
            "SERMAX_terminal/sermax_integracao_comandos.py",
            "sermax_historico_comandos.py",
            "sermax_planejador.py",
            "sermax_executor.py",
            "sermax_tarefas.py",
            "ferramenta_windows.py"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ("SERMAX source integration incomplete. Missing files: " + ($missing -join ", "))
            exit 1
          }
      - name: Verify original terminal UI and commands
        shell: pwsh
        run: |
          $terminal = Get-Content "SERMAX_terminal/sermax_terminal.py" -Raw
          $requiredMarkers = @(
            'ROSTO = r"""',
            'GREEN = "\033[92m"',
            'def render(conversa):',
            'def desenhar(conversa):',
            'if cmd == "/vozdiag":',
            'if cmd == "/reiniciar":',
            'if cmd == "/repetir"'
          )
          $missingMarkers = @($requiredMarkers | Where-Object { -not $terminal.Contains($_) })
          if ($terminal -match "terminal de contingência" -or $missingMarkers.Count -gt 0) {
            Write-Error ("Original terminal UI not restored. Missing markers: " + ($missingMarkers -join ", "))
            exit 1
          }
      - name: Syntax check
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path . -Recurse -File -Filter *.py |
            Where-Object { $_.FullName -notmatch '[\\\\](build|dist|__pycache__)[\\\\]' })
          if ($files.Count -eq 0) { throw "No Python source files found in SERMAX-Windows." }
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }
      - name: Run unit tests when available
        shell: pwsh
        run: |
          if (Test-Path "tests") {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw "Unit tests failed." }
          } else {
            throw "Required test suite is missing."
          }
      - name: Build SERMAX.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean "SERMAX.spec"
      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SERMAX.exe")) { throw "Build did not produce dist/SERMAX.exe." }
          if ((Get-Item "dist/SERMAX.exe").Length -lt 1000000) { throw "SERMAX.exe is unexpectedly small; refusing artifact." }

  real-integrations:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SERMAX-Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14 for SERMAX and Pestinha
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Checkout pinned Pestinha source
        uses: actions/checkout@v4
        with:
          repository: mille-okws/pestinha
          ref: 1b16bd21bb5ba9dd4c460c153f865824f53d05c8
          path: .deps/pestinha

      - name: Prepare Python 3.14 environment for SERMAX and Pestinha
        shell: pwsh
        run: |
          python -m venv .venv-integrations
          $py = ".venv-integrations/Scripts/python.exe"
          & $py -m pip install --upgrade pip pyinstaller "numpy>=2.4.6"
          if ($LASTEXITCODE -ne 0) { throw "Python 3.14 dependencies failed." }
          "PYTHONPATH=$PWD/.deps/pestinha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python 3.13 for OpenJarvis
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OpenJarvis in isolated Python 3.13 environment
        shell: pwsh
        run: |
          python -m venv .venv-jarvis
          $py = ".venv-jarvis/Scripts/python.exe"
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 pip setup failed." }
          & $py -m pip install "git+https://github.com/open-jarvis/OpenJarvis.git@c6c782b924c9040d7c35f76ff693d4057bc0032f"
          if ($LASTEXITCODE -ne 0) { throw "OpenJarvis installation failed." }
          "SERMAX_JARVIS_PYTHON=$PWD/.venv-jarvis/Scripts/python.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SERMAX_ROOT=$PWD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile sources and run SERMAX integration tests
        shell: pwsh
        run: |
          $py = ".venv-integrations/Scripts/python.exe"
          & $py -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Python 3.14 source compilation failed." }
          & $py -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "SERMAX/Pestinha/OpenJarvis integration tests failed." }

      - name: Build SERMAX.exe with Python 3.14
        shell: pwsh
        run: |
          $py = ".venv-integrations/Scripts/python.exe"
          & $py -m PyInstaller --noconfirm --clean "SERMAX.spec"
          if ($LASTEXITCODE -ne 0) { throw "Python 3.14 PyInstaller build failed." }
          if (-not (Test-Path "dist/SERMAX.exe")) { throw "SERMAX.exe was not generated." }
          if ((Get-Item "dist/SERMAX.exe").Length -lt 1000000) { throw "SERMAX.exe is unexpectedly small." }

