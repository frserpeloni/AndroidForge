name: SERMAX Windows CI

on:
  push:
    branches:
      - main
      - sermax-windows-community
    paths:
      - "SERMAX-Windows/**"
      - ".github/workflows/sermax-windows-ci.yml"
  pull_request:
    paths:
      - "SERMAX-Windows/**"
      - ".github/workflows/sermax-windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SERMAX-Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install --upgrade pip pyinstaller
      - name: Syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch '\\(build|dist|__pycache__)\\' }
          if (-not $files) { throw "No Python source files found in SERMAX-Windows." }
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }
      - name: Run unit tests when available
        shell: pwsh
        run: |
          if (Test-Path "tests") {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw "Unit tests failed." }
          } else {
            Write-Host "No tests directory yet; syntax validation only."
          }
      - name: Build SERMAX.exe when spec exists
        shell: pwsh
        run: |
          if (Test-Path "SERMAX.spec") {
            python -m PyInstaller --noconfirm --clean "SERMAX.spec"
          } elseif (Test-Path "sermax_launcher.py") {
            python -m PyInstaller --noconfirm --clean --onefile --console --name SERMAX --add-data "SERMAX_terminal;SERMAX_terminal" sermax_launcher.py
          } else {
            throw "Neither SERMAX.spec nor sermax_launcher.py exists."
          }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERMAX-Windows-CI-${{ github.run_number }}
          path: SERMAX-Windows/dist/SERMAX.exe
          if-no-files-found: error
          retention-days: 14
