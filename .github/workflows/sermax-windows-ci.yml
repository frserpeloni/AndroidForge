name: SERMAX Windows CI

on:
  push:
    branches:
      - main
      - sermax-windows-community
      - sermax-windows-integration-20261029
    paths:
      - "SERMAX-Windows/**"
      - ".github/workflows/sermax-windows-ci.yml"
  pull_request:
    paths:
      - "SERMAX-Windows/**"
      - ".github/workflows/sermax-windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SERMAX-Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore official source bundle
        shell: pwsh
        run: |
          $bundleText = Get-Content "source/SERMAX-python-source-20261029.zip.b64" -Raw
          [IO.File]::WriteAllBytes("source/SERMAX-python-source-20261029.zip", [Convert]::FromBase64String($bundleText.Trim()))
          Expand-Archive -LiteralPath "source/SERMAX-python-source-20261029.zip" -DestinationPath "." -Force
          if (!(Test-Path "sermax_core.py")) { throw "Official sermax_core.py was not restored." }
          if (!(Test-Path "SERMAX_terminal/sermax_terminal.py")) { throw "Original SERMAX terminal was not restored." }
          if (!(Test-Path "SERMAX.spec")) { throw "Official SERMAX.spec was not restored." }
      - name: Install build tool
        run: python -m pip install --upgrade pip pyinstaller
      - name: Syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch '\\(build|dist|__pycache__)\\' }
          if (-not $files) { throw "No Python source files found in SERMAX-Windows." }
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }
      - name: Run SERMAX core tests
        shell: pwsh
        run: |
          python teste_sermax.py
          if ($LASTEXITCODE -ne 0) { throw "SERMAX core tests failed." }
      - name: Build SERMAX.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean "SERMAX.spec"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed." }
          if (!(Test-Path "dist/SERMAX.exe")) { throw "SERMAX.exe was not generated." }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERMAX-Windows-CI-${{ github.run_number }}
          path: SERMAX-Windows/dist/SERMAX.exe
          if-no-files-found: error
          retention-days: 14
