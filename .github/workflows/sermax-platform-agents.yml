name: SERMAX Platform Development Agents

on:
  push:
    branches:
      - sermax-platform-agent-scope-20261122
    paths:
      - "SERMAX-Windows/sermax_platform_github_agent_runner.py"
  pull_request:
    types: [opened, reopened]
    branches:
      - sermax-platform-windows-autostart-20261120
    paths:
      - "SERMAX-Windows/sermax_platform_github_agent_runner.py"
  workflow_dispatch:
    inputs:
      task:
        description: "Tarefa técnica para os agentes SERMAX Platform"
        required: false
        default: >-
          Audite backend e launcher. Escolha uma falha pequena e reproduzível.
          Corrija no máximo dois arquivos permitidos, incluindo teste unittest.
          Preserve contratos. Não faça refatoração ampla. Registre limites do CI Linux
          e pendências de homologação Windows.

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sermax-platform-agents-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  develop:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/sermax-platform-agent-scope-20261122') || (github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened"]'), github.event.action) && github.event.pull_request.head.ref == 'sermax-platform-agent-scope-20261122')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate isolated development branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" != "sermax-platform-agent-scope-20261122" ]; then
            echo "Branch fora do escopo autorizado."
            exit 1
          fi
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "Alterações em main são proibidas."
            exit 1
          fi

      - name: Checkout isolated branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Set up Python 3.13 for OpenJarvis
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned OpenJarvis
        shell: bash
        working-directory: SERMAX-Windows
        run: |
          python -m venv .venv-jarvis
          .venv-jarvis/bin/python -m pip install --upgrade pip
          .venv-jarvis/bin/python -m pip install "git+https://github.com/open-jarvis/OpenJarvis.git@c6c782b924c9040d7c35f76ff693d4057bc0032f"
          echo "SERMAX_JARVIS_PYTHON=$GITHUB_WORKSPACE/SERMAX-Windows/.venv-jarvis/bin/python" >> "$GITHUB_ENV"

      - name: Set up Python 3.14 for SERMAX
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install SERMAX agent dependencies
        shell: bash
        working-directory: SERMAX-Windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.4.6"
          echo "SERMAX_ROOT=$GITHUB_WORKSPACE/SERMAX-Windows" >> "$GITHUB_ENV"

      - name: Run SERMAX Development Team against SERMAX Platform
        working-directory: SERMAX-Windows
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_MAX_TOKENS: "1024"
          SERMAX_DEV_TASK: ${{ inputs.task || 'Audite backend e launcher. Escolha uma falha pequena e reproduzível. Corrija no máximo dois arquivos permitidos, incluindo teste unittest. Preserve contratos e registre limites do CI Linux e pendências de homologação Windows.' }}
        run: python sermax_platform_github_agent_runner.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit only SERMAX Platform changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" != "sermax-platform-agent-scope-20261122" ]; then
            echo "Push bloqueado fora da branch isolada."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SERMAX-Platform
          git reset -q -- SERMAX-Platform/.sermax_dev_backups || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração da Plataforma para registrar."
            exit 0
          fi
          git commit -m "SERMAX Platform agents: implement tested backend task"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:$TARGET_BRANCH"
