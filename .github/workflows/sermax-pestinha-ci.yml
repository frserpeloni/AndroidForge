name: SERMAX Pestinha Integration CI

on:
  push:
    branches:
      - sermax-pestinha-full-integration-20261103
    paths:
      - "SERMAX-Windows/sermax_pestinha/**"
      - "SERMAX-Windows/sermax_cognitive.py"
      - "SERMAX-Windows/tests/test_sermax_cognitive.py"
      - "SERMAX-Windows/sermax_core.py"
      - "SERMAX-Windows/sermax_launcher.py"
      - "SERMAX-Windows/sermax_pestinha_launcher.py"
      - "SERMAX-Windows/SERMAX.spec"
      - ".github/workflows/sermax-pestinha-ci.yml"
  pull_request:
    paths:
      - "SERMAX-Windows/sermax_pestinha/**"
      - "SERMAX-Windows/sermax_cognitive.py"
      - "SERMAX-Windows/tests/test_sermax_cognitive.py"
      - ".github/workflows/sermax-pestinha-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cognitive-core:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install neural dependency
        run: python -m pip install --upgrade pip && python -m pip install -r SERMAX-Windows/sermax_pestinha/requirements.txt pyinstaller
      - name: Compile vendored Pestinha modules
        shell: pwsh
        run: |
          python -m compileall -q SERMAX-Windows/sermax_pestinha/pestinha
          if ($LASTEXITCODE -ne 0) { throw "Pestinha source compilation failed." }
          python -m py_compile SERMAX-Windows/sermax_cognitive.py SERMAX-Windows/sermax_core.py SERMAX-Windows/sermax_launcher.py SERMAX-Windows/sermax_pestinha_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "SERMAX integration source compilation failed." }
      - name: Run cognitive integration tests
        working-directory: SERMAX-Windows
        run: python -m unittest discover -s tests -p test_sermax_cognitive.py -v
      - name: Build integrated SERMAX executable
        working-directory: SERMAX-Windows
        run: python -m PyInstaller --noconfirm --clean SERMAX.spec
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "SERMAX-Windows/dist/SERMAX.exe")) { throw "Integrated SERMAX.exe was not generated." }
          if ((Get-Item "SERMAX-Windows/dist/SERMAX.exe").Length -lt 1000000) { throw "Integrated SERMAX.exe is unexpectedly small." }
