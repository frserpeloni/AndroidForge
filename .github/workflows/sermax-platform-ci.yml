name: SERMAX Platform CI

on:
  push:
    branches:
      - sermax-platform-prototype-20261115
    paths:
      - "SERMAX-Platform/**"
      - ".github/workflows/sermax-platform-ci.yml"

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check SERMAX-Platform/app.js

  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SERMAX-Platform/backend/requirements.txt
      - name: Run backend tests
        working-directory: SERMAX-Platform/backend
        run: python -m unittest -v test_api.py
