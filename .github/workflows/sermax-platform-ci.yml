name: SERMAX Platform CI

on:
  push:
    branches:
      - sermax-platform-prototype-20261115
      - sermax-cleanup-20261117
      - sermax-platform-readiness-20261117
    paths:
      - "SERMAX-Platform/**"
      - ".github/workflows/sermax-platform-ci.yml"
  pull_request:
    branches:
      - sermax-windows-integration-20261029
      - sermax-cleanup-20261117
    paths:
      - "SERMAX-Platform/**"
      - ".github/workflows/sermax-platform-ci.yml"

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check SERMAX-Platform/app.js

  frontend-interaction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SERMAX-Platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI test dependencies
        run: npm install --no-audit --no-fund
      - name: Run UI interaction tests
        run: npm test

  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SERMAX-Platform/backend/requirements.txt
      - name: Run backend tests
        working-directory: SERMAX-Platform/backend
        run: python -m unittest -v test_api.py
      - name: Verify real SERMAX core import without model execution
        working-directory: SERMAX-Platform/backend
        run: python -m unittest -v test_real_core_import.py
      - name: Verify core session restoration after failure
        working-directory: SERMAX-Platform/backend
        run: python -m unittest -v test_core_session_contract.py
      - name: Run installer safety tests
        working-directory: SERMAX-Platform/installer
        run: python -m unittest -v test_installer_core.py
      - name: Run package builder tests
        working-directory: SERMAX-Platform/installer
        run: python -m unittest -v test_package_builder.py
      - name: Run installer GUI policy tests
        working-directory: SERMAX-Platform/installer
        run: python -m unittest -v test_installer_gui.py
      - name: Run platform launcher tests
        working-directory: SERMAX-Platform
        run: python -m unittest discover -s tests -p "test_platform_launcher.py" -v
      - name: Check installer, builder and launcher syntax
        run: python -m py_compile SERMAX-Platform/installer/installer_gui.py SERMAX-Platform/installer/sermax_package_builder.py SERMAX-Platform/sermax_platform_launcher.py

  windows-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SERMAX-Platform/backend/requirements.txt
      - name: Run backend tests on Windows
        working-directory: SERMAX-Platform/backend
        run: python -m unittest -v test_api.py
      - name: Verify real SERMAX core import on Windows
        working-directory: SERMAX-Platform/backend
        run: python -m unittest -v test_real_core_import.py
      - name: Verify core session restoration after failure on Windows
        working-directory: SERMAX-Platform/backend
        run: python -m unittest -v test_core_session_contract.py
      - name: Run UI interaction tests on Windows
        working-directory: SERMAX-Platform
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Run installer safety tests on Windows
        working-directory: SERMAX-Platform/installer
        run: python -m unittest -v test_installer_core.py
      - name: Run package builder tests on Windows
        working-directory: SERMAX-Platform/installer
        run: python -m unittest -v test_package_builder.py
      - name: Run platform launcher tests on Windows
        working-directory: SERMAX-Platform
        run: python -m unittest discover -s tests -p "test_platform_launcher.py" -v
      - name: Check installer, builder and launcher syntax on Windows
        run: python -m py_compile SERMAX-Platform/installer/installer_gui.py SERMAX-Platform/installer/sermax_package_builder.py SERMAX-Platform/sermax_platform_launcher.py
      - name: Verify Windows launcher is present
        run: |
          if (!(Test-Path "SERMAX-Platform/backend/run_local.bat")) { throw "run_local.bat ausente" }
