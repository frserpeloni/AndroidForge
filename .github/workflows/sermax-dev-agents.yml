name: SERMAX Development Agents
# Agent backend now requests schema-constrained JSON for code proposals and test verdicts.
# Agent sandbox ownership is restored before TemporaryDirectory cleanup.
# Linux agents run portable core and team tests; the Windows CI owns Win32-specific coverage.
# Current task is limited to one exact core edit and one new regression test.
# Portable test fixtures use explicit newline construction to avoid escaped-text ambiguity.
# Exact-match patch old/new text is supplied verbatim in the task.
# Failed test output is retained in the task log for diagnosis before rollback.
# Diagnostic output keeps the tail of unittest logs, including failure summaries.
# The responder command API accepts one positional message argument.
# Existing files are modified only through exact-match localized edits.

on:
  push:
    branches:
      - sermax-windows-integration-20261029
      - sermax-platform-prototype-20261115
    paths:
      - ".github/workflows/sermax-dev-agents.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "Tarefa técnica para a equipe SERMAX"
        required: false
        default: 'Corrija o comando /plano e /planejar em sermax_core.responder_comando_local. O código atual usa a expressão `mensagem.split(" ",1)[1].strip()` depois de normalizar a entrada em `comando`. Faça uma única edição localizada com estes valores exatos: old = `mensagem.split(" ",1)[1].strip()`; new = `comando.split(" ",1)[1].strip()`. Não inclua indentação nem a linha return no trecho old. Não altere nenhum outro trecho de sermax_core.py. Adicione somente `tests/test_sermax_core_command_regression.py` com testes unittest para /plano e /planejar usando espaços iniciais e espaços ou tabulações repetidos. A assinatura é `responder_comando_local(mensagem)`, chame a função com exatamente um argumento, sem passar None. Faça mock de sermax_planejador.planejar e confirme que recebe somente o objetivo. Altere exatamente `sermax_core.py` e o novo teste. Não reescreva arquivos completos. Não crie stubs, dependências ou alterações fora do escopo. A proposta deve incluir unittest.'
        type: string

permissions:
  contents: write

concurrency:
  group: sermax-dev-agents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  develop:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate target branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "A equipe não está autorizada a trabalhar na main."
            exit 1
          fi

      - name: Checkout selected development branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python 3.13 for OpenJarvis
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OpenJarvis in isolated Python 3.13 environment
        shell: bash
        working-directory: SERMAX-Windows
        run: |
          python -m venv .venv-jarvis
          .venv-jarvis/bin/python -m pip install --upgrade pip
          .venv-jarvis/bin/python -m pip install "git+https://github.com/open-jarvis/OpenJarvis.git@c6c782b924c9040d7c35f76ff693d4057bc0032f"
          echo "SERMAX_JARVIS_PYTHON=$GITHUB_WORKSPACE/SERMAX-Windows/.venv-jarvis/bin/python" >> "$GITHUB_ENV"

      - name: Set up Python 3.14 for SERMAX and Pestinha
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Checkout pinned Pestinha source
        uses: actions/checkout@v4
        with:
          repository: mille-okws/pestinha
          ref: 1b16bd21bb5ba9dd4c460c153f865824f53d05c8
          path: SERMAX-Windows/.deps/pestinha

      - name: Install Python 3.14 dependencies
        shell: bash
        working-directory: SERMAX-Windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.4.6"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/SERMAX-Windows/.deps/pestinha" >> "$GITHUB_ENV"
          echo "SERMAX_ROOT=$GITHUB_WORKSPACE/SERMAX-Windows" >> "$GITHUB_ENV"

      - name: Preflight isolated test sandbox and ownership cleanup
        working-directory: SERMAX-Windows
        run: |
          python - <<'PY'
          from pathlib import Path
          from sermax_workspace import TestRunner, WorkspaceAdapter

          workspace = WorkspaceAdapter(Path.cwd())
          result = TestRunner(
              workspace, timeout_seconds=300, isolate_as_nobody=True
          ).run("unittest")
          print(result["output"])
          if result["status"] != "passed":
              raise SystemExit(f"Preflight falhou: {result['status']}")
          print("Sandbox isolada validada e propriedade restaurada.")
          PY

      - name: Run the SERMAX development team
        working-directory: SERMAX-Windows
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_MAX_TOKENS: "2048"
          SERMAX_DEV_ALLOWED_PATHS: "sermax_core.py;tests/test_sermax_core_command_regression.py"
          SERMAX_DEV_TASK: >-
            ${{ inputs.task || 'Corrija o comando /plano e /planejar em sermax_core.responder_comando_local. O código atual usa a expressão `mensagem.split(" ",1)[1].strip()` depois de normalizar a entrada em `comando`. Faça uma única edição localizada com estes valores exatos: old = `mensagem.split(" ",1)[1].strip()`; new = `comando.split(" ",1)[1].strip()`. Não inclua indentação nem a linha return no trecho old. Não altere nenhum outro trecho de sermax_core.py. Adicione somente `tests/test_sermax_core_command_regression.py` com testes unittest para /plano e /planejar usando espaços iniciais e espaços ou tabulações repetidos. A assinatura é `responder_comando_local(mensagem)`, chame a função com exatamente um argumento, sem passar None. Faça mock de sermax_planejador.planejar e confirme que recebe somente o objetivo. Altere exatamente `sermax_core.py` e o novo teste. Não reescreva arquivos completos. Não crie stubs, dependências ou alterações fora do escopo. A proposta deve incluir unittest.' }}
        run: python sermax_github_agent_runner.py

      - name: Review patch format
        run: git diff --check

      - name: Commit tested changes to the selected development branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Push para main bloqueado."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SERMAX-Windows
          git reset -q -- SERMAX-Windows/.sermax_dev_backups SERMAX-Windows/.venv-jarvis SERMAX-Windows/.deps || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
            exit 0
          fi
          git commit -m "SERMAX agents: implement tested development task"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:${GITHUB_REF_NAME}"
